<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>幻影解图</title>
  <style>
    html, body {
      margin: 0;
      background: #fff;
    }
    canvas {
      display: block;
    }
    #source {
      display: none;
    }
    #imageFileInput {
      position: fixed;
      left: 0;
      top: 0;
      width: 10px;
      height: 10px;
      opacity: 0;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <input type="file" id="imageFileInput" accept="image/*">
  <canvas id="source"></canvas>
  <canvas id="black"></canvas>
  <canvas id="white"></canvas>

  <script>
    const source = document.getElementById('source');
    const black = document.getElementById('black');
    const white = document.getElementById('white');
    const fileInput = document.getElementById('imageFileInput');

    function drawCanvas(canvas, image, width, height) {
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d');
      if (!context) throw new Error('无法创建画布上下文');
      context.clearRect(0, 0, width, height);
      context.drawImage(image, 0, 0);
      return context;
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          URL.revokeObjectURL(url);
          resolve(image);
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('图片加载失败'));
        };
        image.src = url;
      });
    }

    async function splitImage(file) {
      const image = await loadImage(file);
      const width = image.naturalWidth || image.width;
      const height = image.naturalHeight || image.height;

      drawCanvas(source, image, width, height);
      drawCanvas(black, source, width, height);
      drawCanvas(white, source, width, height);

      const blackContext = black.getContext('2d');
      const whiteContext = white.getContext('2d');
      if (!blackContext || !whiteContext) throw new Error('无法创建画布上下文');

      // 先铺满不透明底色，再叠加原图，透明区域会被客户端截图固化为对应背景色
      blackContext.fillStyle = '#000';
      blackContext.fillRect(0, 0, width, height);
      blackContext.drawImage(source, 0, 0);

      whiteContext.fillStyle = '#fff';
      whiteContext.fillRect(0, 0, width, height);
      whiteContext.drawImage(source, 0, 0);
    }

    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        await splitImage(file);
      } catch (error) {
        console.error('幻影解图失败', error);
      }
    });
  </script>
</body>
</html>
