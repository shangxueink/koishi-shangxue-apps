<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; width: 1000px; background: #f5f7fa; color: #1f2937; font-family: Arial, sans-serif; }
    #result-root { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 12px; background: #ffffff; border: 1px solid #d9e0e8; border-radius: 8px; }
    .item { min-height: 106px; padding: 12px; border: 1px solid #e5e7eb; border-radius: 6px; background: #ffffff; }
    .name { overflow-wrap: anywhere; font-size: 16px; font-weight: 700; line-height: 1.35; color: #111827; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 12px; color: #4b5563; font-size: 12px; line-height: 1.3; }
    .empty { padding: 30px; color: #6b7280; text-align: center; }
  </style>
</head>
<body>
  <main id="result-root">
    <!--RESULTS-->
  </main>
</body>
</html>
